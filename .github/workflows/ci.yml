name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Placeholder values so the production build can run in CI.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      ADMIN_PASSWORD: ci-placeholder
      ADMIN_SESSION_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      # `next build` generates next-env.d.ts (image/CSS module types) and
      # type-checks the app, so it must run before the standalone tsc pass.
      - name: Production build
        run: npm run build
      - name: Type check
        run: npx tsc --noEmit
